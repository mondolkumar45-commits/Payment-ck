name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts NOT FOUND - project files were not uploaded"
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$F")"
          pwd
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PayHubSmsForwarder-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
