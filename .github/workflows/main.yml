name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          rm -rf project
          mkdir project
          unzip -q PayHubSmsForwarder.zip -d project
          find project -maxdepth 3 | head -30
      - name: Build
        run: |
          F=$(find project -name settings.gradle.kts | head -n1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts NOT FOUND inside the zip"
            exit 1
          fi
          cd "$(dirname "$F")"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PayHubSmsForwarder-debug-apk
          path: "project/**/app/build/outputs/apk/debug/app-debug.apk"
